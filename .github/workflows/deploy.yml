name: Build and deploy

# Every push to main deploys the production build (https://fixnow.com.ar) to the Hostinger site.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build and check
        run: |
          node tools/build.mjs --site https://fixnow.com.ar
          node tools/build.mjs --site https://mediumpurple-pig-827825.hostingersite.com --staging
          node tools/check-build.mjs
      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          exclude: |
            BUILD-REPORT.txt
            ASSET-MANIFEST.json
