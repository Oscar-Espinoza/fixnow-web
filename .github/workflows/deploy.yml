name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "staging or production"
        default: staging

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build and check both packages
        run: |
          node tools/build.mjs --site https://fixnow.com.ar
          node tools/build.mjs --site https://mediumpurple-pig-827825.hostingersite.com --staging
          node tools/check-build.mjs
          if [ "${{ inputs.target }}" = "production" ]; then echo "OUT=dist" >> $GITHUB_ENV; else echo "OUT=dist-staging" >> $GITHUB_ENV; fi
      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ inputs.target == 'production' && secrets.FTP_SERVER_PRODUCTION || secrets.FTP_SERVER }}
          username: ${{ inputs.target == 'production' && secrets.FTP_USERNAME_PRODUCTION || secrets.FTP_USERNAME }}
          password: ${{ inputs.target == 'production' && secrets.FTP_PASSWORD_PRODUCTION || secrets.FTP_PASSWORD }}
          local-dir: ./${{ env.OUT }}/
          server-dir: ./
          exclude: |
            BUILD-REPORT.txt
            ASSET-MANIFEST.json
